<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
<header class="container">
    <nav>
        <ul>
            <li><a href="/" class="brand">Knowledge Base</a></li>
        </ul>
        <ul>
            <li><a href="/entries">All Entries</a></li>
            <li><a href="/entries/new" role="button">+ New Entry</a></li>
            <li><a href="/settings" class="settings-link" title="Settings">&#9881;</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <div class="stats">
        <span th:text="'Total entries: ' + ${totalEntries}">Total entries: 0</span>
    </div>

    <div>
        <input type="search"
               name="q"
               placeholder="Search entries..."
               hx-get="/search"
               hx-trigger="keyup changed delay:300ms, search"
               hx-target="#results"
               hx-indicator="#search-spinner"
               autocomplete="off">
        <span id="search-spinner" class="htmx-indicator" aria-busy="true">Searching...</span>
    </div>

    <div id="results">
        <div th:if="${entries.isEmpty()}" class="empty-state">
            <p>No entries yet. Create your first one!</p>
            <a href="/entries/new" role="button">Create Entry</a>
        </div>
        <div th:each="entry : ${entries}" class="entry-card">
            <h4><a th:href="'/entries/' + ${entry.id}" th:text="${entry.title}">Title</a></h4>
            <p th:if="${previews.get(entry.id) != null and !previews.get(entry.id).isEmpty()}"
               th:text="${previews.get(entry.id)}">
                Preview...
            </p>
            <div>
                <span th:each="tag : ${entry.tagList}" class="tag" th:text="${tag}">tag</span>
            </div>
            <div class="entry-meta">
                <span th:text="${#temporals.format(entry.updatedAt, 'yyyy-MM-dd HH:mm')}">2025-01-01</span>
            </div>
        </div>
    </div>
</main>
<script>
(function(){
    fetch('/api/lock-status').then(function(r){return r.json()}).then(function(d){
        if(d.timeout>0){window.__lockTimeout=d.timeout;}
    });
})();
</script>
<script src="/static/lock-timer.js"></script>
</body>
</html>
