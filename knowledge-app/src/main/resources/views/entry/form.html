<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editing} ? 'Edit Entry' : 'New Entry'">New Entry</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
<header class="container">
    <nav>
        <ul>
            <li><a href="/" class="brand">Knowledge Base</a></li>
        </ul>
        <ul>
            <li><a href="/entries">All Entries</a></li>
            <li><a href="/backup">Backup</a></li>
            <li><a href="/entries/new" role="button">+ New Entry</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <h2 th:text="${editing} ? 'Edit Entry' : 'New Entry'">New Entry</h2>

    <form th:action="${editing} ? '/entries/' + ${entry.id} : '/entries'" method="post">
        <label for="title">Title</label>
        <input type="text" id="title" name="title"
               th:value="${entry != null} ? ${entry.title} : ''"
               placeholder="Entry title" required autofocus>

        <label for="content">Content</label>
        <textarea id="content" name="content" rows="12"
                  placeholder="Write your knowledge here..."
                  th:text="${entry != null} ? ${entry.content} : ''"></textarea>

        <label for="tags">Tags (comma-separated)</label>
        <input type="text" id="tags" name="tags"
               th:value="${entry != null} ? ${entry.tags} : ''"
               placeholder="e.g. java, architecture, patterns">

        <div class="actions">
            <button type="submit" th:text="${editing} ? 'Save Changes' : 'Create Entry'">Create Entry</button>
            <a th:href="${editing} ? '/entries/' + ${entry.id} : '/'"
               role="button" class="secondary">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
